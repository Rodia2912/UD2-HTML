<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Reserva de habitación</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <form action="reserva.php" method="get">
<fieldset>
    <legend> Datos del solicitante</legend>
    <label for="nombre">Nombre y Apellidos:</label>
    <input type="text" placeholder="Ingresa tu nombre" id="nombre" value="" maxlength="100" size="12" required>
    <br> <br>
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" placeholder="" required maxlength="9" size="9">
</fieldset>
<fieldset>
    <legend>Datos de la Reserva</legend>
    <label for="habitación">Habitación</label>
    <select name="habitación" id="habitación">
        <option value="Azul">Azul</option>
        <option value="Verde">Verde</option>
        <option value="Amarilla">Amarilla</option>
        <option value="Morada">Morada</option>
    </select>
    <label for="tipo">Tipo</label>
    <select name="tipo" id="tipo">
        <option value="Individual" id="tipo">Individual</option>
        <option value="Doble" id="tipo" selected>Doble</option>
        </select>
        <br>
        <label for="provincia">Provincia</label>
    <select name="provincia" id="provincia">
        <option value="Galicia">Galicia</option>
    </select>
</fieldset>

    </form>
</body>
</html>
